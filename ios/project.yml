name: AIDotsVibrationTest
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  AIDotsVibrationTest:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bellamiecreative.aidotstest
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_KEY_CFBundleDisplayName: AI Dots Test
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
