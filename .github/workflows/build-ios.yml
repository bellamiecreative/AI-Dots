name: Build iOS Haptics Test

on:
  push:
    branches: [ios-vibration-test]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-simulator:
    name: Build native iOS simulator app
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -30

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/AIDotsVibrationTest.xcodeproj \
            -scheme AIDotsVibrationTest \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          cd build/DerivedData/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent AIDotsVibrationTest.app "$GITHUB_WORKSPACE/AI-Dots-iOS-Simulator.zip"

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: ai-dots-ios-simulator-build
          path: AI-Dots-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
